spring.application.name=bhumi-vikas-ai-service
server.port=${AI_SERVICE_PORT:8081}

# Provider secrets belong only to this process.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:}

# Set the same value as BVS_AI_SERVICE_TOKEN in the backend for non-local deployments.
bvs.internal-token=${BVS_AI_SERVICE_TOKEN:}
