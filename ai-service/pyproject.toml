[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bhumi-vikas-ai-service"
version = "0.1.0"
description = "Isolated Python LLM and language-understanding service for Bhumi Vikas Sahayak"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bhumi-vikas-ai-service = "ai_service.__main__:main"

[tool.setuptools]
packages = ["ai_service", "ai_service.calculators", "ai_service.providers", "ai_service.services"]
