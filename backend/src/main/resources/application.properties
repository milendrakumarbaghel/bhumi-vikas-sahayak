spring.application.name=bhumi-vikas-sahayak
server.port=${PORT:8080}

# Rules data (paths are relative to the backend/ folder; override with env vars)
bvs.data-dir=${BVS_DATA_DIR:../track-1-bhumi-vikas-sahayak/data}
bvs.pdf-file=${BVS_PDF_FILE:../track-1-bhumi-vikas-sahayak/resources/MP_Bhumi_Vikas_Rules_2012_upto_2025-03-06_EN.pdf}

# Vite dev server
bvs.cors-origins=${BVS_CORS_ORIGINS:http://localhost:5173}

# Optional internal AI service. The backend contains no LLM/provider credentials.
bvs.ai-service.enabled=${BVS_AI_ENABLED:true}
bvs.ai-service.base-url=${BVS_AI_SERVICE_URL:http://localhost:8081}
bvs.ai-service.internal-token=${BVS_AI_SERVICE_TOKEN:}
bvs.ai-service.timeout=${BVS_AI_SERVICE_TIMEOUT:5s}
