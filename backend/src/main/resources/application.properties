spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-muddy-breeze-b4qai3x9-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_Gah8HsR2xPwD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

# Multipart File Uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Application Config
app.upload.dir=uploads/answer-sheets
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.ai-service.url=${APP_AI_SERVICE_URL:http://localhost:8000}
app.ai-service.mock-fallback=true
app.moderation.variance-threshold=3.0
app.moderation.confidence-threshold=0.70

server.port=${PORT:8080}

bvs.rules-resource=classpath:data/bhumi_vikas_rules.jsonl
bvs.pdf-file=${BVS_PDF_FILE:../track-1-bhumi-vikas-sahayak/resources/MP_Bhumi_Vikas_Rules_2012_upto_2025-03-06_EN.pdf}
bvs.cors-origins=${BVS_CORS_ORIGINS:http://localhost:5173}
bvs.ai-service.enabled=${BVS_AI_ENABLED:true}
bvs.ai-service.base-url=${BVS_AI_SERVICE_URL:${app.ai-service.url}}
bvs.ai-service.internal-token=${BVS_AI_SERVICE_TOKEN:}
bvs.ai-service.timeout=${BVS_AI_SERVICE_TIMEOUT:5s}
